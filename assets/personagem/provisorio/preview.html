<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>ATLAS — animação provisória</title><style>body{background:#202b30;color:#e6e3d9;font:16px system-ui;margin:32px}button,select{font:inherit;margin:0 8px 20px 0;padding:8px;background:#3c505a;color:#fff;border:1px solid #8ba5a8}main{display:flex;gap:20px;flex-wrap:wrap}figure{margin:0;background:#707d79;padding:18px;text-align:center}img{width:160px;height:192px;image-rendering:pixelated;display:block}figcaption{padding-top:10px}p{max-width:760px;line-height:1.5}</style><h1>ATLAS — animação provisória</h1><p>Desenho autoral de teste. Referências originais preservadas. A velocidade lenta mantém os mesmos quadros; não adiciona interpolação.</p><select id="mode"><option value="walk">Caminhada</option><option value="idle">Espera</option><option>attack_windup</option><option>attack_active</option><option>attack_recovery</option><option>parry</option><option>dodge</option><option>hurt</option><option>dead</option></select><button id="speed">Velocidade: normal</button><button id="pause">Pausar</button><main></main><p id="frame"></p><script>
const dirs=['down','left','right','up'], labels=['Baixo','Esquerda','Direita','Cima'];let slow=false,paused=false,time=0,last=performance.now(),imgs=[];
dirs.forEach((d,i)=>{const f=document.createElement('figure');const im=document.createElement('img');im.alt='Personagem olhando para '+labels[i];const c=document.createElement('figcaption');c.textContent=labels[i];f.append(im,c);document.querySelector('main').append(f);imgs.push(im)});
document.querySelector('#speed').onclick=e=>{slow=!slow;e.target.textContent='Velocidade: '+(slow?'½':'normal')};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Retomar':'Pausar'};document.querySelector('#mode').onchange=()=>time=0;
function tick(now){const mode=document.querySelector('#mode').value, n=mode==='walk'?6:mode==='idle'?4:3,fps=mode==='walk'?8:mode==='idle'?4:6;if(!paused)time+=(now-last)/1000*(slow?.5:1);last=now;const frame=Math.floor(time*fps)%n;imgs.forEach((im,i)=>{const src=mode+'_'+dirs[i]+'_'+frame+'.svg';if(!im.src.endsWith(src))im.src=src});document.querySelector('#frame').textContent='Quadro '+(frame+1)+' / '+n+' · origem dos pés (20, 46) · 40 × 48 px';requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
